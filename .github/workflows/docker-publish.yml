# NutriSnap server CI/CD — mirrors the studybuddy pipeline:
# push to main → build server image → push to Docker Hub →
# SSH into the VPS → pull + recreate (migrations run first via `migrate`).
name: Server — build, push & deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/docker-publish.yml"

env:
  IMAGE: irfan140/nutrisnap-server
  VPS_DIR: /opt/apps/nutrisnap

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # Exposes the "Production" environment secrets (VPS_HOST/USER/KEY).
    environment: Production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "$VPS_DIR"
            docker compose -f docker-compose.prod.yml pull api worker migrate
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
        env:
          VPS_DIR: ${{ env.VPS_DIR }}
